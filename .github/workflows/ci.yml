name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types, boundaries
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: sqlite:///ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy .
      - name: import-linter
        run: uv run lint-imports
      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bartoszup
          POSTGRES_USER: bartoszup
          POSTGRES_PASSWORD: bartoszup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bartoszup"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: postgres://bartoszup:bartoszup@localhost:5432/bartoszup
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Django system checks (prod settings)
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-but-long-enough-to-pass-the-deploy-check-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: example.com
      - name: pytest
        run: uv run pytest --create-db --cov --cov-report=term-missing

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

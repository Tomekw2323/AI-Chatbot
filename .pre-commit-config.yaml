# Install once: uv run pre-commit install
exclude: ^static/vendor/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      # Local hooks use the versions pinned in uv.lock, so CI and pre-commit agree.
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (module boundaries)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: missing-migrations
        name: django makemigrations --check
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        types: [python]
        pass_filenames: false

# Free public demo. NOT the production blueprint.
# The later paid launch (Frankfurt web + cron + Postgres) is render.yaml.
# Do not apply render.yaml for this demo.
#
# One free Docker web service. No database and no cron. SQLite is created
# inside the container on every start (free instances have no persistent disk).
services:
  - type: web
    name: bartoszup-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/run_demo.sh
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.demo
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: bartoszup-demo.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://bartoszup-demo.onrender.com
      - key: SITE_URL
        value: https://bartoszup-demo.onrender.com
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
